[package]
name = "refpact"
description = "Architecture tests for Rust: rules about what code may depend on, checked as ordinary tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
# The tests read fixtures and conformance cases outside the crate, so they stay out.
include = ["src/**", "tests/readme_examples.md", "README.md", "LICENSE"]
publish.workspace = true

[dependencies]
refpact-core = { path = "../refpact-core", version = "=0.5.1" }
syn.workspace = true
proc-macro2.workspace = true

[dev-dependencies]
# Reads the conformance cases in tests/conformance.rs.
serde_json.workspace = true
